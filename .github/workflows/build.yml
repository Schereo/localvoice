# Builds the portable app on a GitHub-hosted Apple Silicon runner, signs it with the
# Developer ID, wraps it in a signed disk image, has Apple notarize that once and
# publishes it on GitHub Releases:
#
#   push to main (every merged PR)  ->  dev pre-release v<VERSION>-dev.<run>,
#                                       "LocalVoice Test" (com.localvoice.dev)
#   push of tag v<VERSION>          ->  the release itself, "LocalVoice" (com.localvoice.app),
#                                       with its notes from CHANGELOG.md; then the website
#                                       is redeployed with the new download and the
#                                       Homebrew cask in Schereo/homebrew-tap moved to it
#
# Each build also publishes the Sparkle update feed (appcast.xml) the app's updater
# reads, with delta patches from the last two builds of its channel that have the
# updater. Releases are found through releases/latest/download/appcast.xml, dev
# builds through the fixed `dev-feed` pre-release.
#
# Two jobs: `build` runs the checks and all third-party build code without any
# secrets; `sign` gets the unsigned app as an artifact on a fresh runner and only
# signs, notarizes and publishes it. The signing secrets live in the `release`
# environment, which only main and release tags (vX.Y.Z) may use, so pull requests
# never see them.
# Free for public repos: GitHub-hosted macOS runners cost nothing here.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters only apply to branch pushes; a tag always builds.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "wrangler.jsonc"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel, so a release is never interrupted halfway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
      base: ${{ steps.version.outputs.base }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag check below needs main's history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version
          python3 --version

      # The updater framework; check.sh then compiles the launcher against it too.
      - name: Sparkle
        run: ./scripts/fetch-sparkle.sh

      - name: Checks
        run: ./scripts/check.sh

      - name: Cache Core ML worker build
        uses: actions/cache@v4
        with:
          path: build/parakeet-worker
          key: parakeet-${{ runner.os }}-${{ hashFiles('providers/parakeet/Package.swift', 'providers/parakeet/Package.resolved', 'providers/parakeet/Sources/**') }}

      - name: Version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$base" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($base). Cut releases with scripts/release.sh."
              exit 1
            fi
            # Release only what is on main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main."
              exit 1
            fi
            {
              echo "channel=release"
              echo "tag=v$base"
              echo "bundle_id=com.localvoice.app"
              echo "display_name=LocalVoice"
              echo "feed_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=dev"
              echo "tag=v$base-dev.$GITHUB_RUN_NUMBER"
              echo "bundle_id=com.localvoice.dev"
              echo "display_name=LocalVoice Test"
              echo "feed_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-feed/appcast.xml"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # The updater offers a build only if its CFBundleVersion is higher. The commit
          # count on main only grows, unlike the run number (it restarts with the workflow).
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        env:
          VERSION_BASE: ${{ steps.version.outputs.base }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
          DISPLAY_NAME: ${{ steps.version.outputs.display_name }}
          FEED_URL: ${{ steps.version.outputs.feed_url }}
        run: |
          python3 -B scripts/build-dev-app.py --portable \
            --version "$VERSION_BASE" \
            --build-number "$BUILD_NUMBER" \
            --bundle-identifier "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME" \
            --feed-url "$FEED_URL"
          codesign --verify --deep --strict build/dev/LocalVoice.app
          # ditto keeps the bundle's symlinks and permissions, which the artifact zip would not.
          ditto -c -k --keepParent build/dev/LocalVoice.app build/LocalVoice-unsigned.zip

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: build/LocalVoice-unsigned.zip
          compression-level: 0 # already compressed
          retention-days: 3
          if-no-files-found: error

  # A fresh runner that runs no third-party build code: the certificate never
  # shares a machine with pip installs or the build.
  sign:
    needs: build
    runs-on: macos-26
    timeout-minutes: 200 # notarization can take 150 minutes, the delta patches a few more
    environment: release
    permissions:
      contents: write # create the release
      actions: write # start the website deploy after a release
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    env:
      KEEP_DEV_RELEASES: 10
      CHANNEL: ${{ needs.build.outputs.channel }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION_BASE: ${{ needs.build.outputs.base }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          name: unsigned-app
          path: build

      - name: Unpack
        run: |
          mkdir -p build/dev
          ditto -x -k build/LocalVoice-unsigned.zip build/dev
          rm build/LocalVoice-unsigned.zip
          codesign --verify --deep --strict build/dev/LocalVoice.app

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "::error::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are missing from the release environment."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # codesign builds the certificate chain from the search list, so add the keychain to it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERT_P12 contains no Developer ID Application identity."
            exit 1
          fi
          echo "Signing as: $identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign
        run: python3 -B scripts/sign-app.py build/dev/LocalVoice.app --keychain "$SIGNING_KEYCHAIN"

      # The usual Mac download: open the image, drag the app onto the Applications link.
      - name: Disk image
        id: package
        run: |
          if [[ "$CHANNEL" == release ]]; then volume="LocalVoice"; else volume="LocalVoice Test"; fi
          dmg="build/LocalVoice-$TAG-arm64.dmg"
          root="$RUNNER_TEMP/dmg-root"
          mkdir -p "$root"
          ditto build/dev/LocalVoice.app "$root/LocalVoice.app"
          ln -s /Applications "$root/Applications"
          # ULFO (LZFSE) mounts fast and opens on every macOS the app supports.
          hdiutil create -volname "$volume" -srcfolder "$root" -format ULFO -ov "$dmg"
          codesign --sign "$CODESIGN_IDENTITY" --keychain "$SIGNING_KEYCHAIN" --timestamp "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      # One submission: the notary service checks the app inside the image too and issues
      # its ticket along with the image's, which is stapled to the image.
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          DMG: ${{ steps.package.outputs.dmg }}
          # Usually minutes, but Apple's queue has taken close to two hours.
          NOTARY_TIMEOUT: 150m
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          ./scripts/notarize-app.sh "$DMG"

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

      - name: Checksum
        id: checksum
        env:
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          (cd build && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          echo "sha256=$(cut -d ' ' -f 1 < "$DMG.sha256")" >> "$GITHUB_OUTPUT"

      - name: Install notes
        env:
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          name="$(basename "$DMG")"
          cat > build/install.md <<EOF
          ### Install

          1. Download \`$name\` and open it.
          2. Drag **LocalVoice** onto **Applications**.
          3. Open the app and follow **Permissions…**. Signed builds keep their permissions across updates.

          Signed with Developer ID and notarized by Apple. Requires an Apple Silicon Mac with macOS 15 or later.
          Models are downloaded from the app's **Models…** window.

          ### Update

          Releases after 1.3.0 update themselves: a new version appears in the menu bar menu and under
          **Settings › General › Updates** and installs in place, usually as a patch of a few MB. Permissions, models
          and settings stay. Coming from 1.3.0 or older, install this one over it once as above.
          EOF

      # The feed the app's updater reads, and patches from the last two builds of this
      # channel that have the updater: a few MB instead of the whole image. The
      # certificate is gone by now; only the EdDSA key that signs updates is here.
      - name: Update feed and delta patches
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is missing from the release environment."
            exit 1
          fi
          # The app is in the disk image now; the earlier images and their unpacked apps need the room.
          rm -rf build/dev
          if [[ "$CHANNEL" == release ]]; then
            ./scripts/release.sh --notes "$VERSION_BASE" > build/update-notes.md
          else
            {
              echo "Dev build \`${GITHUB_SHA::7}\` from \`main\`."
              echo
              ./scripts/release.sh --notes Unreleased || true
            } > build/update-notes.md
          fi
          sparkle="$(./scripts/fetch-sparkle.sh | sed -n 's/^Sparkle: //p')"
          feed() {
            python3 -B scripts/make-appcast.py --channel "$CHANNEL" --tag "$TAG" \
              --build-number "$BUILD_NUMBER" --dmg "$DMG" --notes build/update-notes.md \
              --sparkle "$sparkle" --out build/updates "$@"
          }
          # Patches are a saving, not a requirement: rather than hold the release back,
          # publish the feed without them (everyone then downloads the full image).
          if ! feed; then
            echo "::warning::Delta patches failed; publishing the update feed without them."
            rm -rf build/updates
            feed --deltas 0
          fi

      - name: Publish dev pre-release
        if: env.CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          {
            echo "Automatic dev build of \`${GITHUB_SHA::7}\` from \`main\`, for testing. It installs as"
            echo "**LocalVoice Test** next to a LocalVoice release. Rows left by an older unsigned dev build show"
            echo "**Old entry** under Permissions; use **Re-add…** once."
            echo
            cat build/install.md
          } > build/notes.md
          xargs gh release create "$TAG" "$DMG" "$DMG.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "LocalVoice $TAG" --notes-file build/notes.md < build/updates/upload.txt
          # GitHub's latest-release link skips pre-releases, so installed dev builds read
          # their feed from this one fixed pre-release.
          if gh release view dev-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload dev-feed build/updates/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create dev-feed build/updates/appcast.xml \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Dev update feed" \
              --notes "The update feed of the LocalVoice Test dev builds, replaced by every dev build. Keep it: installed dev builds read appcast.xml from here."
          fi

      - name: Publish release
        if: env.CHANNEL == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          {
            ./scripts/release.sh --notes "$VERSION_BASE"
            echo
            cat build/install.md
          } > build/notes.md
          # The installed apps find the update through releases/latest/download/appcast.xml.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release created by hand keeps its text; it only gains the signed app and the feed.
            xargs gh release upload "$TAG" "$DMG" "$DMG.sha256" --repo "$GITHUB_REPOSITORY" --clobber \
              < build/updates/upload.txt
          else
            xargs gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "LocalVoice $VERSION_BASE" --notes-file build/notes.md < build/updates/upload.txt
          fi

      # A release made with this job's token starts no workflows by itself
      # (GitHub's loop guard); a dispatch is the exception. The deploy stamps
      # the download with the latest release, which is now this one.
      - name: Update the website
        if: env.CHANNEL == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cloudflare-workers.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Prune old dev releases
        if: env.CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[(env.KEEP_DEV_RELEASES | tonumber):] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

  # Moves the Homebrew cask (brew install --cask schereo/tap/localvoice) to the new
  # release, so `brew upgrade` sees it right away. The tap repository accepts pushes
  # from a deploy key that only it trusts; the key is a secret of the `release`
  # environment. The release is already published when this runs: if it fails,
  # re-run this job or edit Casks/localvoice.rb in the tap by hand.
  homebrew:
    needs: [build, sign]
    if: needs.build.outputs.channel == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      VERSION_BASE: ${{ needs.build.outputs.base }}
      SHA256: ${{ needs.sign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Schereo/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Update cask
        run: |
          if [[ ! "$VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected version '$VERSION_BASE' or checksum '$SHA256'."
            exit 1
          fi
          cask=Casks/localvoice.rb
          sed -i -E \
            -e "s/^  version \"[^\"]*\"$/  version \"$VERSION_BASE\"/" \
            -e "s/^  sha256 \"[^\"]*\"$/  sha256 \"$SHA256\"/" "$cask"
          grep -qx "  version \"$VERSION_BASE\"" "$cask"
          grep -qx "  sha256 \"$SHA256\"" "$cask"
          if git diff --quiet; then
            echo "The cask is already at $VERSION_BASE."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "localvoice $VERSION_BASE"
          git push origin HEAD:main
