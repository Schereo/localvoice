# Builds the portable app on a GitHub-hosted Apple Silicon runner, signs it with the
# Developer ID, has Apple notarize it and publishes it on GitHub Releases:
#
#   push to main (every merged PR)  ->  dev pre-release v<VERSION>-dev.<run>,
#                                       "LocalVoice Test" (com.localvoice.dev)
#   push of tag v<VERSION>          ->  the release itself, "LocalVoice" (com.localvoice.app),
#                                       with its notes from CHANGELOG.md
#
# Two jobs: `build` runs the checks and all third-party build code without any
# secrets; `sign` gets the unsigned app as an artifact on a fresh runner and only
# signs, notarizes and publishes it. The signing secrets live in the `release`
# environment, which only main and release tags (vX.Y.Z) may use, so pull requests
# never see them.
# Free for public repos: GitHub-hosted macOS runners cost nothing here.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Path filters only apply to branch pushes; a tag always builds.
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "wrangler.jsonc"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel, so a release is never interrupted halfway.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      tag: ${{ steps.version.outputs.tag }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag check below needs main's history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Toolchain
        run: |
          sw_vers
          xcrun swift --version
          python3 --version

      - name: Checks
        run: ./scripts/check.sh

      - name: Cache Core ML worker build
        uses: actions/cache@v4
        with:
          path: build/parakeet-worker
          key: parakeet-${{ runner.os }}-${{ hashFiles('providers/parakeet/Package.swift', 'providers/parakeet/Package.resolved', 'providers/parakeet/Sources/**') }}

      - name: Version
        id: version
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$base" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($base). Cut releases with scripts/release.sh."
              exit 1
            fi
            # Release only what is on main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main."
              exit 1
            fi
            {
              echo "channel=release"
              echo "tag=v$base"
              echo "bundle_id=com.localvoice.app"
              echo "display_name=LocalVoice"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=dev"
              echo "tag=v$base-dev.$GITHUB_RUN_NUMBER"
              echo "bundle_id=com.localvoice.dev"
              echo "display_name=LocalVoice Test"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        env:
          VERSION_BASE: ${{ steps.version.outputs.base }}
          BUNDLE_ID: ${{ steps.version.outputs.bundle_id }}
          DISPLAY_NAME: ${{ steps.version.outputs.display_name }}
        run: |
          python3 -B scripts/build-dev-app.py --portable \
            --version "$VERSION_BASE" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --bundle-identifier "$BUNDLE_ID" \
            --display-name "$DISPLAY_NAME"
          codesign --verify --deep --strict build/dev/LocalVoice.app
          # ditto keeps the bundle's symlinks and permissions, which the artifact zip would not.
          ditto -c -k --keepParent build/dev/LocalVoice.app build/LocalVoice-unsigned.zip

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: build/LocalVoice-unsigned.zip
          compression-level: 0 # already compressed
          retention-days: 3
          if-no-files-found: error

  # A fresh runner that runs no third-party build code: the certificate never
  # shares a machine with pip installs or the build.
  sign:
    needs: build
    runs-on: macos-26
    timeout-minutes: 75
    environment: release
    permissions:
      contents: write # create the release
    env:
      KEEP_DEV_RELEASES: 10
      CHANNEL: ${{ needs.build.outputs.channel }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION_BASE: ${{ needs.build.outputs.base }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        with:
          name: unsigned-app
          path: build

      - name: Unpack
        run: |
          mkdir -p build/dev
          ditto -x -k build/LocalVoice-unsigned.zip build/dev
          rm build/LocalVoice-unsigned.zip
          codesign --verify --deep --strict build/dev/LocalVoice.app

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERT_P12" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "::error::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are missing from the release environment."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # codesign builds the certificate chain from the search list, so add the keychain to it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERT_P12 contains no Developer ID Application identity."
            exit 1
          fi
          echo "Signing as: $identity"
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign
        run: python3 -B scripts/sign-app.py build/dev/LocalVoice.app --keychain "$SIGNING_KEYCHAIN"

      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          ./scripts/notarize-app.sh build/dev/LocalVoice.app

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

      - name: Package
        id: package
        run: |
          zip="LocalVoice-$TAG-arm64.zip"
          ditto -c -k --keepParent build/dev/LocalVoice.app "build/$zip"
          (cd build && shasum -a 256 "$zip" > "$zip.sha256")
          echo "zip=build/$zip" >> "$GITHUB_OUTPUT"

      - name: Install notes
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          name="$(basename "$ZIP")"
          cat > build/install.md <<EOF
          ### Install

          1. Download \`$name\` and unzip it.
          2. Move **LocalVoice.app** to \`/Applications\` (or wherever you like).
          3. Open the app and follow **Permissions…**. Signed builds keep their permissions across updates.

          Signed with Developer ID and notarized by Apple. Requires an Apple Silicon Mac with macOS 15 or later.
          Models are downloaded from the app's **Models…** window.
          EOF

      - name: Publish dev pre-release
        if: env.CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          {
            echo "Automatic dev build of \`${GITHUB_SHA::7}\` from \`main\`, for testing. It installs as"
            echo "**LocalVoice Test** next to a LocalVoice release. Rows left by an older unsigned dev build show"
            echo "**Old entry** under Permissions; use **Re-add…** once."
            echo
            cat build/install.md
          } > build/notes.md
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "LocalVoice $TAG" --notes-file build/notes.md

      - name: Publish release
        if: env.CHANNEL == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          {
            ./scripts/release.sh --notes "$VERSION_BASE"
            echo
            cat build/install.md
          } > build/notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release created by hand keeps its text; it only gains the signed app.
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "LocalVoice $VERSION_BASE" --notes-file build/notes.md
          fi

      - name: Prune old dev releases
        if: env.CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[(env.KEEP_DEV_RELEASES | tonumber):] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
